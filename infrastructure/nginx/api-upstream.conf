# REST API upstream. least_conn spreads long-running requests (uploads, AI) evenly.
# Replace the example hosts via your deployment tooling (no addresses are baked into the app).
upstream meetclone_api {
    least_conn;
    server api-1:5000 max_fails=3 fail_timeout=10s;
    server api-2:5000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}
