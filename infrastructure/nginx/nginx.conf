# MeetClone edge config (http-level). TLS: terminate here or at a cloud LB; certificate paths are placeholders
# to be mounted from your secret store. WebRTC media (UDP/TCP 40000-49999 on SFU hosts) never goes through this proxy.
include /etc/nginx/meetclone/api-upstream.conf;
include /etc/nginx/meetclone/websocket-upstream.conf;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

limit_req_zone  $binary_remote_addr zone=api_rl:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr zone=auth_rl:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
    listen 80;
    server_name _;
    location /healthz { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name meet.example.com;                       # placeholder
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 55m;
    limit_conn conn_per_ip 50;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503;   # POSTs are not retried by default

    location /socket.io/ {
        proxy_pass http://meetclone_ws;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;    # > pingInterval+pingTimeout (45s)
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location /api/auth/ {
        limit_req zone=auth_rl burst=10 nodelay;
        proxy_pass http://meetclone_api;
        proxy_set_header Connection "";
    }

    location ~ ^/api/(meetings/.+/recordings|files/upload) {
        proxy_pass http://meetclone_api;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 1g;
    }

    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        proxy_pass http://meetclone_api;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location / { proxy_pass http://meetclone_api; proxy_set_header Connection ""; }
}
# Active health checks (GET /readyz) need nginx Plus or a cloud LB; OSS nginx only has passive max_fails/fail_timeout.
