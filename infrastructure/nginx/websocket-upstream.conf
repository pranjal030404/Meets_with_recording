# Socket.IO upstream. The client uses transports ['websocket','polling'], so polling requests of one
# session MUST reach the same node: ip_hash gives stickiness.
# NOTE: in-meeting state (waiting room, admissions, timers, mediasoup routers) is still process-local
# until Phase 3, so a MEETING must not be split across Socket nodes. See docs/SCALABILITY_ROADMAP.md.
upstream meetclone_ws {
    ip_hash;
    server api-1:5000 max_fails=3 fail_timeout=10s;
    server api-2:5000 max_fails=3 fail_timeout=10s;
}
