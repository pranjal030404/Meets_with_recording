# Ships PM2 JSON logs (LOG_FORMAT=json) to Loki. Run promtail as a systemd service on each node host.
server: { http_listen_port: 9080, grpc_listen_port: 0 }
positions: { filename: /var/lib/promtail/positions.yaml }
clients: [ { url: http://LOKI_HOST:3100/loki/api/v1/push } ]
scrape_configs:
  - job_name: meetclone
    static_configs:
      - targets: [ localhost ]
        labels: { job: meetclone, __path__: /var/www/Meets_with_recording/backend/logs/*.log }
    pipeline_stages:
      - json: { expressions: { level: level, node: node, msg: msg } }
      - labels: { level: , node: }          # low-cardinality only; never label by user/room id
