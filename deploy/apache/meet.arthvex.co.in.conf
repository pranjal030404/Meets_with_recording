# /etc/apache2/sites-available/meet.arthvex.co.in.conf
#
# One domain, two PM2 apps:
#   /api, /uploads, /socket.io  -> backend  (127.0.0.1:5004)
#   everything else             -> frontend (127.0.0.1:5005)
#
# Modules: sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers ssl deflate expires

<VirtualHost *:80>
    ServerName meet.arthvex.co.in
    # Needed for certbot; redirects everything else to HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName meet.arthvex.co.in

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/meet.arthvex.co.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/meet.arthvex.co.in/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/meet_error.log
    CustomLog ${APACHE_LOG_DIR}/meet_access.log combined

    ProxyPreserveHost On
    ProxyTimeout 3600
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # Camera/mic need a secure context + permission policy
    Header always set Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)"

    # --- Speed: compress text assets and let browsers cache the fingerprinted bundles forever ---
    AddOutputFilterByType DEFLATE text/html text/css application/javascript text/javascript application/json image/svg+xml
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(index\.html)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    # --- Socket.IO: websocket upgrade first, then plain-HTTP polling ---
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket.io/(.*)$ ws://127.0.0.1:5004/socket.io/$1 [P,L]

    ProxyPass        /socket.io/ http://127.0.0.1:5004/socket.io/
    ProxyPassReverse /socket.io/ http://127.0.0.1:5004/socket.io/

    # --- Backend REST + uploaded files ---
    ProxyPass        /api/     http://127.0.0.1:5004/api/
    ProxyPassReverse /api/     http://127.0.0.1:5004/api/
    ProxyPass        /uploads/ http://127.0.0.1:5004/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:5004/uploads/

    # --- Frontend (must come last) ---
    ProxyPass        / http://127.0.0.1:5005/
    ProxyPassReverse / http://127.0.0.1:5005/
</VirtualHost>
