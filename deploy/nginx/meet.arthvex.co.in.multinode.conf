# nginx load balancer for 2+ PM2 backend nodes on ONE VPS (backend/ecosystem.vps.config.cjs).
# Replaces deploy/nginx/meet.arthvex.co.in.conf (do not enable both).
#
# How it works
#  * meet.arthvex.co.in            -> REST (least_conn) + lobby/non-meeting Socket.IO (ip_hash) + static frontend.
#  * node1/node2.meet.arthvex.co.in -> ONE backend each. A meeting lives on one node; the client asks
#    /api/meetings/:id/placement and opens its meeting socket on that node's hostname (NODE_PUBLIC_URL).
#  * Media (UDP/TCP 40000-49999) never touches nginx.
#
# DNS: A records for meet, node1.meet, node2.meet -> the VPS IP.
# Cert: sudo certbot certonly --nginx -d meet.arthvex.co.in -d node1.meet.arthvex.co.in -d node2.meet.arthvex.co.in
#       (one SAN cert, cert dir stays /etc/letsencrypt/live/meet.arthvex.co.in/). Node 3? add a vhost + name.

upstream meet_api {
    least_conn;                                   # REST is stateless (JWT) -> any node
    server 127.0.0.1:5010 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5011 max_fails=3 fail_timeout=10s;
    keepalive 32;
}
upstream meet_ws {
    ip_hash;                                      # Socket.IO long-polling needs the same node per client
    server 127.0.0.1:5010 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5011 max_fails=3 fail_timeout=10s;
}
upstream meet_node1 { server 127.0.0.1:5010; keepalive 16; }
upstream meet_node2 { server 127.0.0.1:5011; keepalive 16; }
upstream meet_frontend { server 127.0.0.1:5005; keepalive 16; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# NOTE: these zone names are global to nginx. If another site on this VPS already defines them, rename here.
limit_req_zone  $binary_remote_addr zone=meet_api_rl:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr zone=meet_auth_rl:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=meet_conn_ip:10m;

server {
    listen 80;
    server_name meet.arthvex.co.in node1.meet.arthvex.co.in node2.meet.arthvex.co.in;
    return 301 https://$host$request_uri;
}

# ---- main entry point ----
server {
    listen 443 ssl http2;
    server_name meet.arthvex.co.in;
    ssl_certificate     /etc/letsencrypt/live/meet.arthvex.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.arthvex.co.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:meet_ssl:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 200m;
    limit_conn meet_conn_ip 100;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;

    location /socket.io/ {
        proxy_pass http://meet_ws;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/auth/ {
        limit_req zone=meet_auth_rl burst=10 nodelay;
        proxy_pass http://meet_api;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503;
    }

    # big uploads (recordings, files): stream straight to the node, long timeouts
    location ~ ^/api/(meetings/.+/recordings|files/upload) {
        proxy_pass http://meet_api;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 1g;
    }

    location ~ ^/(api|uploads)/ {
        limit_req zone=meet_api_rl burst=40 nodelay;
        proxy_pass http://meet_api;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503;   # POSTs are not retried by default
    }

    location = /healthz {
        access_log off;
        proxy_pass http://meet_api/api/health;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://meet_frontend;
        proxy_set_header Connection "";
    }
}

# ---- per-node vhosts (meeting sockets go straight to the owner node) ----
server {
    listen 443 ssl http2;
    server_name node1.meet.arthvex.co.in;
    ssl_certificate     /etc/letsencrypt/live/meet.arthvex.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.arthvex.co.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 200m;
    location = /healthz { access_log off; proxy_pass http://meet_node1/api/health; }
    location / {
        proxy_pass http://meet_node1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
server {
    listen 443 ssl http2;
    server_name node2.meet.arthvex.co.in;
    ssl_certificate     /etc/letsencrypt/live/meet.arthvex.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.arthvex.co.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 200m;
    location = /healthz { access_log off; proxy_pass http://meet_node2/api/health; }
    location / {
        proxy_pass http://meet_node2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
