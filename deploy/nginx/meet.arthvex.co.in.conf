# nginx reverse proxy / load balancer for meet.arthvex.co.in
# Install: sudo cp this file /etc/nginx/sites-available/ && sudo ln -s ../sites-available/meet.arthvex.co.in.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: meeting state (mediasoup rooms, in-memory room runtime) lives inside ONE backend process.
# Every request that belongs to the same room/user MUST reach the same backend, hence `ip_hash` (sticky).
# Start with a single `server` line. Add more only after reading "Scaling out" in deploy/DEPLOY.md.

upstream meet_backend {
    ip_hash;                                  # sticky: same client -> same backend (needed for Socket.IO)
    server 127.0.0.1:5004 max_fails=3 fail_timeout=10s;
    # server 10.0.0.12:5004 max_fails=3 fail_timeout=10s;   # 2nd node (see Scaling out)
    keepalive 32;
}

upstream meet_frontend {
    server 127.0.0.1:5005;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name meet.arthvex.co.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name meet.arthvex.co.in;

    ssl_certificate     /etc/letsencrypt/live/meet.arthvex.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.arthvex.co.in/privkey.pem;

    client_max_body_size 200m;                # file uploads / recordings
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Socket.IO (WebSocket upgrade, long-lived)
    location /socket.io/ {
        proxy_pass http://meet_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # REST API + uploaded files
    location ~ ^/(api|uploads)/ {
        proxy_pass http://meet_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503;   # retry only when the node is down
    }

    # Balancer health probe (does not hit the app log)
    location = /healthz {
        access_log off;
        proxy_pass http://meet_backend/api/health;
    }

    # Frontend (static build served by `serve` on 5005)
    location / {
        proxy_pass http://meet_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}

# NOTE: mediasoup audio/video does NOT pass through nginx. It flows directly over UDP/TCP 40000-49999
# to the backend's MEDIASOUP_ANNOUNCED_IP, so that port range must stay open on the server firewall.
